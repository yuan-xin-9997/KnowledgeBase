name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ runner.temp }}/kb-offline
      SYNC_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # No deployment, acceptance.mjs, credentials, NAS mounts or external model calls.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
